<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    *{
        margin: 0;
        padding: 0;
    }
.cointainer{
    background-color: rgb(3, 3, 28);
    color: white;
    width: 100vw;
}
span{
    align-items: end;
}
.Hero{
    background-color: rgb(32, 83, 211);
    height: 90vh;
    width: 100vw;
    text-align: center;
    padding-top: 3%;
    color: white;
    gap: 10px;
    
}
img{
    height: 70vh;
    width: 95vw;
    padding-top: 2%;
    align-items: center;
    border-radius: 10px ;
}
.mainbox{
    display: grid;
    grid-template-columns: 1fr;
    grid-template-rows: 1fr 1fr 1fr;
    gap: 30px;

}
.box{
    height: 20vh;
    width: 40vh;
    border: 1px ;
    background-color: rgb(245, 8, 114);
    border-radius: 3%;
    margin: 20PX;
    padding: 20px;
}


@media (min-width: 500px){
    .mainbox{
        grid-template-rows: 1fr;
        grid-template-columns: 1fr 1fr 1fr;
    }
.cointainer{
    background-color: rgb(3, 3, 28);
    color: white;
    width: 100vw;
    text-align: center;
}
   
}
@media (min-width: 500px) and (max-width:1159px){
    .mainbox{
        grid-template-rows: 1fr 1fr;
        grid-template-columns: 1fr 1fr ;
    }

}
footer{
    background-color: blue;
    height: 50px;
    height: 100%;
}

</style>
<body>
    <div class="cointainer">

      </div>
    </div>

        <img src="./image/Capitol-Peak-1600px-DMP-Website.jpg" alt="hj">
    </section>
    <section class="mainbox">
        <div class="box">
            <h3>Easy Booking</h3>

        </div>
        <div class="box">
            <h3>Best Prices</h3>
            <p>We compare for you.</p>

        <div class="box">
             <h3>24x7 Help</h3>
            <p>We are always online.</p>

</html>
